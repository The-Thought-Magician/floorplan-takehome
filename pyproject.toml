[project]
name = "floorplan-takehome"
version = "0.1.0"
description = "Dimensioned floor plans from phone camera captures"
authors = [
    { name = "Chiranjeet Mishra", email = "chiranjeetmishra13@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.7.0",
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.32.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
    "trimesh>=5.1.0",
    "uvicorn[standard]>=0.53.0",
]


[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
